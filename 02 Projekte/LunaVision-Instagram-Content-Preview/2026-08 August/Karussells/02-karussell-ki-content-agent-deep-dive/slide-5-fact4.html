<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../assets/fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px}
  body{font-family:'Inter',sans-serif}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:#F5F7FA;background:#080B14}
  .bg-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;filter:brightness(1.65) saturate(1.6) contrast(1.15)}
  .blue-tint{position:absolute;inset:0;background:#2E5C99;mix-blend-mode:color;opacity:.55}
  .bg-overlay{position:absolute;inset:0;background-image:linear-gradient(180deg, rgba(8,11,20,.88) 0%, rgba(8,11,20,.5) 25%, rgba(8,11,20,.4) 50%, rgba(8,11,20,.03) 68%, rgba(8,11,20,.03) 84%, rgba(8,11,20,.55) 100%), linear-gradient(90deg, rgba(8,11,20,.25) 0%, rgba(8,11,20,0) 45%)}
  .brand-mark{position:absolute;top:60px;left:64px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;letter-spacing:.02em}
  .brand-mark .dot{width:13px;height:13px;border-radius:50%;background:#C7A75A}
  .page-tag{position:absolute;top:60px;right:64px;font-size:22px;font-weight:800;color:#C7A75A;letter-spacing:.06em;border:1.5px solid rgba(199,167,90,.5);border-radius:999px;padding:10px 26px}
  .content{position:absolute;bottom:190px;left:64px;right:64px;top:0;display:flex;flex-direction:column;justify-content:center}
  .accent-line{width:70px;height:5px;background:#C7A75A;margin-bottom:32px;border-radius:3px}
  h1{font-weight:900;font-size:58px;line-height:1.2;letter-spacing:-.02em;margin-bottom:32px;max-width:900px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
  p.sub{font-size:32px;line-height:1.6;color:rgba(245,247,250,.92);max-width:860px;text-shadow:0 2px 6px rgba(0,0,0,.85),0 8px 24px rgba(0,0,0,.6)}
  .swipe{position:absolute;bottom:64px;right:64px;font-size:26px;color:rgba(245,247,250,.75);text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .footer-handle{position:absolute;bottom:64px;left:64px;font-size:26px;color:rgba(245,247,250,.6)}
</style>
</head>
<body>
  <div class="slide">
    <img class="bg-photo" src="../../../Hintergrund-Varianten/skyline-nacht-chicago.jpg">
    <div class="blue-tint"></div>
    <div class="bg-overlay"></div>
    <div class="brand-mark"><span class="dot"></span> LUNAVISION</div>
    <div class="page-tag">04 / 04</div>
    <div class="content">
      <div class="accent-line"></div>
      <h1>Eigene KI-Bildwelten? Auf Anfrage möglich.</h1>
      <p class="sub">Reichen Standard-Textgrafiken nicht, baue ich individuelle Bildwelten für deinen Content – auf Anfrage.</p>
    </div>
    <div class="footer-handle">@lunavision.ai</div>
    <div class="swipe">Weiter →</div>
  </div>
</body>
</html>
