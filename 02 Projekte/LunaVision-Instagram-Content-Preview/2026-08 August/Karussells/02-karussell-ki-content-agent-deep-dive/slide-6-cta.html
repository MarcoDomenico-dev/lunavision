<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<style>
  @font-face {
    font-family: 'Inter';
    src: url('../../../../../assets/fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px}
  body{font-family:'Inter',sans-serif}
  .slide{width:1080px;height:1350px;position:relative;overflow:hidden;color:#F5F7FA;background:#080B14}
  .bg-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 65%;filter:brightness(1.65) saturate(1.6) contrast(1.15)}
  .blue-tint{position:absolute;inset:0;background:#2E5C99;mix-blend-mode:color;opacity:.55}
  .bg-overlay{position:absolute;inset:0;background-image:linear-gradient(180deg, rgba(8,11,20,.88) 0%, rgba(8,11,20,.5) 25%, rgba(8,11,20,.4) 50%, rgba(8,11,20,.03) 68%, rgba(8,11,20,.03) 84%, rgba(8,11,20,.55) 100%), linear-gradient(90deg, rgba(8,11,20,.25) 0%, rgba(8,11,20,0) 45%)}
  .brand-mark{position:absolute;top:60px;left:64px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;letter-spacing:.02em}
  .brand-mark .dot{width:13px;height:13px;border-radius:50%;background:#C7A75A}
  .badge{position:absolute;top:150px;left:64px;display:inline-flex;align-items:center;border:1.5px solid #C7A75A;border-radius:999px;padding:12px 26px;font-size:22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E7D19B}
  .content{position:absolute;top:230px;bottom:190px;left:64px;right:64px;display:flex;flex-direction:column;justify-content:center}
  h1{font-weight:900;font-size:62px;line-height:1.18;letter-spacing:-.02em;margin-bottom:36px;max-width:900px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
  p.sub{font-size:32px;line-height:1.55;color:rgba(245,247,250,.92);margin-bottom:48px;max-width:820px;text-shadow:0 2px 6px rgba(0,0,0,.85),0 8px 24px rgba(0,0,0,.6)}
  .cta-row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .cta{display:inline-flex;align-items:center;gap:16px;background:linear-gradient(135deg,#F0CE7E,#B8873A);color:#20140A;font-weight:900;font-size:32px;padding:26px 52px;border-radius:999px;box-shadow:0 18px 44px rgba(184,135,58,.45),0 4px 12px rgba(0,0,0,.4);border:1px solid rgba(255,238,204,.5)}
  .price-box{display:inline-flex;flex-direction:column;gap:2px;background:rgba(8,11,20,.55);border:1px solid rgba(199,167,90,.45);border-radius:18px;padding:16px 28px}
  .price-box .amount{font-weight:900;font-size:32px;color:#F5F7FA}
  .price-box .desc{font-size:20px;color:rgba(245,247,250,.65)}
  .footer-handle{position:absolute;bottom:64px;left:64px;font-size:26px;color:rgba(245,247,250,.6)}
  .footer-url{position:absolute;bottom:64px;right:64px;font-size:26px;color:rgba(245,247,250,.7)}
</style>
</head>
<body>
  <div class="slide">
    <img class="bg-photo" src="../../../Hintergrund-Varianten/skyline-nacht-chicago.jpg">
    <div class="blue-tint"></div>
    <div class="bg-overlay"></div>
    <div class="brand-mark"><span class="dot"></span> LUNAVISION</div>
    <div class="badge">Zusammengefasst</div>
    <div class="content">
      <h1>Bereit für Content, der läuft – ohne dass du ihn selbst schreibst?</h1>
      <p class="sub">Ich richte den KI-Content-Agenten für dich ein.</p>
      <div class="cta-row">
        <div class="cta">Jetzt anfragen →</div>
        <div class="price-box">
          <span class="amount">399 € · 199 €/Monat</span>
          <span class="desc">Einrichtungspreis, danach monatlich</span>
        </div>
      </div>
    </div>
    <div class="footer-handle">@lunavision.ai</div>
    <div class="footer-url">lunavision.org</div>
  </div>
</body>
</html>
